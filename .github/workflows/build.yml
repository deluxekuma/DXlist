name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 曲庫沒上傳也沒關係，這裡會現場從 dxrating 上游生成。
      # 已經有 assets/dxdata_slim.json 就直接沿用，不覆蓋。
      - name: Prepare catalog
        run: |
          if [ -f assets/dxdata_slim.json ]; then
            echo "使用 repo 內的曲庫："
            ls -la assets/dxdata_slim.json
          else
            echo "repo 內沒有曲庫，從上游生成"
            mkdir -p assets
            curl -sSL --retry 3 -o /tmp/dxdata.json \
              https://raw.githubusercontent.com/gekichumai/dxrating/main/packages/dxdata/dxdata.json
            python3 tools/slim_dxdata.py /tmp/dxdata.json assets/dxdata_slim.json
            ls -la assets/dxdata_slim.json
          fi

      - name: Convert SVG app icon to PNG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1080 -h 1080 assets/dxlist_icon.svg \
            -o assets/dxlist_icon.png
          rsvg-convert -w 1080 -h 1080 assets/dxlist_icon_foreground.svg \
            -o assets/dxlist_icon_foreground.png
          rsvg-convert -w 1080 -h 1080 assets/dxlist_icon_monochrome.svg \
            -o assets/dxlist_icon_monochrome.png
          file assets/dxlist_icon*.png

      # 專案裡只放 lib/ 與 pubspec.yaml，android/ 由 flutter create 現場生成。
      # flutter create 會覆寫 pubspec.yaml，所以先備份再還原。
      - name: Scaffold android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r assets /tmp/assets
          flutter create --platforms=android --org derakuma --project-name dxlist .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf assets && cp -r /tmp/assets assets
          flutter pub get
          dart run flutter_launcher_icons

      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="DXList"/' "$M"
          # release 版預設沒有連網權限，補上才能抓曲繪。
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i '0,/<manifest[^>]*>/s|\(<manifest[^>]*>\)|\1\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$M"
          cat "$M"

      # 版本號跟著 workflow 的執行次數跑：1.0.<run number>。
      # 每次都不一樣，Android 才會當成新版本、直接覆蓋安裝。
      - name: Write app version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          printf "/// 由 CI 產生，本地開發時是 'dev'。\nconst String kAppVersion = '%s';\n" "$VERSION" > lib/build_info.dart
          cat lib/build_info.dart
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"

      # 金鑰庫不進版控，改成每次建置時從 secrets 還原。
      # 需要的 secrets：
      #   KEYSTORE_BASE64    金鑰庫檔的 base64（base64 -w0 檔名）
      #   KEYSTORE_PASSWORD  金鑰庫密碼
      #   KEY_PASSWORD       私鑰密碼
      #   KEY_ALIAS          金鑰別名（dxkuma_key）
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret：KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p ~/.signing
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.signing/dxkuma-release.jks
          ls -la ~/.signing/dxkuma-release.jks

      # 用固定金鑰簽名。
      # 不這樣做的話，每次 CI 產生的 debug 金鑰都不同，
      # 簽名不一致的手機就沒辦法直接覆蓋安裝，只能先解除安裝。
      - name: Sign APK (fixed keystore)
        env:
          KS_PATH: /home/runner/.signing/dxkuma-release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "使用 build-tools: $BT"
          mkdir -p out
          "$BT/zipalign" -f -p 4 build/app/outputs/flutter-apk/app-release.apk out/aligned.apk
          # 先把舊的（debug）簽名檔拿掉，再簽上固定金鑰。
          zip -q -d out/aligned.apk "META-INF/*.RSA" "META-INF/*.SF" "META-INF/*.MF" || true
          "$BT/apksigner" sign \
            --ks "$KS_PATH" --ks-type JKS --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" \
            --out "out/DXList-$VERSION.apk" out/aligned.apk
          rm -f out/aligned.apk
          "$BT/apksigner" verify --print-certs "out/DXList-$VERSION.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: DXList-apk
          path: out/DXList-*.apk
          if-no-files-found: error
